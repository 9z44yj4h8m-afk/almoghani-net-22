<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALMOGHANI LIVE — العرض الأفقي</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#e8e8e8;font-family:Arial,Tahoma,sans-serif}
body{direction:ltr}header{display:none}
.layout{display:grid;grid-template-columns:52% 48%;height:100dvh;direction:ltr;background:#000}
.sidebar{grid-column:1;grid-row:1;direction:ltr;min-width:0;display:flex;flex-direction:column;background:#111;border-left:7px solid #242424;border-right:2px solid #252525;padding:0 7px}
.sidebar:before{content:"◉   ALMOGHANI LIVE";height:79px;display:flex;align-items:center;font-size:25px;font-weight:800;padding:0 22px;color:#f4f4f4;background:#111}
.sidebar:after{content:"";display:none}
.filters{order:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;padding:8px 0 9px;background:#111;border-top:1px solid #262626;border-bottom:1px solid #282828}
.filters select,.filters input{width:100%;min-width:0;height:53px;background:#181818;border:2px solid #383838;color:#eee;border-radius:12px;padding:9px;font-size:17px;font-weight:700;outline:0}
.filters select:first-child{border-color:#379d50;background:#142b1b}
.hint{order:-1;height:79px;min-height:79px;display:flex;align-items:center;color:#999;background:#050505;font-size:14px;line-height:1.5;padding:8px 14px}
.list{flex:1;overflow-y:auto;padding:3px 0 15px}
.channel{direction:ltr;display:flex;align-items:center;gap:14px;width:100%;height:78px;margin:0 0 1px;padding:10px 17px;background:#111;border:2px solid transparent;border-radius:11px;color:#ddd;text-align:left;cursor:pointer}
.channel.active{background:#17331e;border:3px solid #369b4a;color:white;box-shadow:0 0 0 1px #194a26}
.channel .icon{display:grid;place-items:center;width:52px;height:52px;min-width:52px;border-radius:6px;background:#f5f5f5;font-size:26px}
.channel b{font-size:19px;display:block}.channel small{display:block;font-size:15px;color:#aaa;margin-top:3px}
.channel.active:after{content:"▶";color:#43aa5c;margin-left:auto;font-size:23px}
.sidebar>div:last-child{padding:8px!important;border-top:1px solid #292929}
.player{grid-column:2;grid-row:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;background:#000;padding:24px 6% 10px;direction:ltr}
.screen{width:100%;max-width:460px;aspect-ratio:16/11;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;border:0;border-radius:0;color:#777}
.screen video,.screen iframe{width:100%;height:100%;object-fit:contain;border:0}
.info{width:100%;max-width:460px;display:flex;align-items:center;justify-content:flex-start;gap:18px;padding-top:4px;direction:ltr}
.logo{width:100px;height:100px;min-width:100px;border-radius:9px;background:#fff;color:#222;display:grid;place-items:center;font-size:47px;border:0}
.info h2{font-family:Georgia,serif;font-size:38px;margin:0 0 6px;font-weight:400}.info small{font-size:19px;color:#aaa;line-height:1.35}
@media(max-width:680px){.layout{grid-template-columns:54% 46%}.sidebar{border-left-width:2px;padding:0 3px}.sidebar:before{height:53px;font-size:15px;padding:0 8px}.hint{height:55px;min-height:55px;font-size:9px;padding:4px}.filters{gap:3px;padding:4px 0}.filters select,.filters input{height:35px;font-size:10px;padding:2px}.channel{height:62px;padding:5px;gap:6px}.channel .icon{width:38px;height:38px;min-width:38px;font-size:20px}.channel b{font-size:12px}.channel small{font-size:9px}.player{padding:5px}.screen{width:100%;aspect-ratio:16/11}.info{gap:6px}.logo{width:40px;height:40px;min-width:40px;font-size:20px}.info h2{font-size:16px}.info small{font-size:10px}}
</style></head><body><header><div><h1>🟢 ALMOGHANI LIVE</h1><small>عرض أفقي للقنوات</small></div><span>● LIVE</span></header><main class="layout"><section class="player"><div class="screen" id="screen"><div style="text-align:center"><div style="font-size:52px">📺</div><p>اختر قناة للمشاهدة</p></div></div><div class="info"><div class="logo" id="logo">📺</div><div><h2 id="title">اختر قناة</h2><small id="meta">القنوات والتصنيفات</small></div></div></section><aside class="sidebar"><div class="filters"><select id="country"><option value="">🌐 جميع الدول</option></select><select id="category"><option value="">📺 جميع الأقسام</option></select><input id="search" placeholder="🔎 بحث عن قناة"></div><div class="hint">يمكنك إضافة روابط البث المرخصة من ملف M3U الخاص بك.</div><div class="list" id="list"></div><div style="padding:12px"><label style="display:block;border:1px solid #555;padding:10px;border-radius:8px;text-align:center;cursor:pointer">📂 استيراد ملف M3U <input id="file" type="file" accept=".m3u,.m3u8,text/plain" hidden></label></div></aside></main><script>let channels=[{name:"القرآن الكريم",country:"السعودية",group:"إسلامية",icon:"🕋"},{name:"السنة النبوية",country:"السعودية",group:"إسلامية",icon:"🕌"},{name:"السعودية الأولى",country:"السعودية",group:"عامة",icon:"🇸🇦"},{name:"الإخبارية السعودية",country:"السعودية",group:"أخبار",icon:"📰"},{name:"تلفزيون قطر",country:"قطر",group:"عامة",icon:"🇶🇦"},{name:"تلفزيون الكويت",country:"الكويت",group:"عامة",icon:"🇰🇼"},{name:"تلفزيون عمان",country:"عمان",group:"عامة",icon:"🇴🇲"}];const $=id=>document.getElementById(id);function filters(){for(const [id,key] of [["country","country"],["category","group"]]){let v=$(id).value;$(id).innerHTML='<option value="">'+(id==="country"?"🌐 جميع الدول":"📺 جميع الأقسام")+'</option>'+[...new Set(channels.map(x=>x[key]))].filter(Boolean).map(s=>'<option>'+s.replace(/</g,"&lt;")+'</option>').join("");$(id).value=v}render()}function render(){let l=channels.filter(x=>(!$("country").value||x.country===$("country").value)&&(!$("category").value||x.group===$("category").value)&&x.name.includes($("search").value));$("list").replaceChildren(...l.map(c=>{let b=document.createElement("button");b.className="channel";b.innerHTML='<span class="icon">'+(c.icon||"📺")+'</span><span><b></b><small></small></span>';b.querySelector("b").textContent=c.name;b.querySelector("small").textContent=[c.group,c.country].filter(Boolean).join(" • ");b.onclick=()=>{document.querySelectorAll(".channel").forEach(x=>x.classList.remove("active"));b.classList.add("active");$("title").textContent=c.name;$("meta").textContent=[c.group,c.country].filter(Boolean).join(" • ");$("logo").textContent=c.icon||"📺";$("screen").replaceChildren();if(c.url){let v=document.createElement("video");v.controls=true;v.autoplay=true;v.playsInline=true;v.src=c.url;$("screen").append(v)}else{$("screen").textContent="لا يوجد رابط بث مضاف لهذه القناة"}};return b}))}for(let id of ["country","category","search"])$(id).addEventListener("input",render);$("file").onchange=async e=>{let t=await e.target.files[0].text();let items=t.split(/\r?\n/);let out=[];for(let i=0;i<items.length;i++){if(!items[i].startsWith("#EXTINF"))continue;let line=items[i];let name=line.split(",").slice(1).join(",").trim()||"قناة";let group=(line.match(/group-title="([^"]*)"/)||[])[1]||"عام";let country=(line.match(/tvg-country="([^"]*)"/)||[])[1]||"غير محدد";let url=(items[i+1]||"").trim();if(url&&!url.startsWith("#"))out.push({name,group,country,url,icon:"📺"})}if(out.length){channels=out;filters();alert("تم استيراد "+out.length+" قناة")}else alert("لم يُعثر على روابط قنوات صالحة")};filters();</script></body></html>
