const channels=[{name:"MBC 1",logo:"MBC",type:"all",meta:"ترفيه • مجموعة MBC • السعودية"},{name:"العربية",logo:"العربية",type:"news",meta:"أخبار • الإمارات"},{name:"الحدث",logo:"الحدث",type:"news",meta:"أخبار • السعودية"},{name:"الجزيرة",logo:"الجزيرة",type:"news",meta:"أخبار • قطر"},{name:"beIN SPORTS 1",logo:"beIN",type:"sport",meta:"رياضة • قطر"},{name:"السعودية الأولى",logo:"السعودية",type:"all",meta:"قنوات سعودية • السعودية"},{name:"القرآن الكريم",logo:"القرآن",type:"all",meta:"قنوات إسلامية • السعودية"}];let current=0,filter="all";const list=document.getElementById("list");function draw(){list.innerHTML="";channels.forEach((c,i)=>{if(filter!=="all"&&c.type!==filter&&!(filter==="fav"&&localStorage.getItem("fav-"+i)==="1"))return;let b=document.createElement("button");b.className="channel"+(i===current?" selected":"");b.innerHTML='<span class="logo">'+c.logo+'</span><span><strong>'+c.name+'</strong><small>'+c.meta+'</small></span><span class="arrow">▶</span>';b.onclick=()=>choose(i);list.appendChild(b)})}function choose(i){current=i;let c=channels[i];document.getElementById("title").textContent=c.name;document.getElementById("meta").textContent=c.meta;document.getElementById("bigLogo").textContent=c.logo;document.getElementById("screen").innerHTML='<div class="placeholder">▶<br>'+c.name+'<br><small>معاينة التصميم — رابط البث غير مضاف بعد</small></div>';draw()}document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));draw()});draw();
