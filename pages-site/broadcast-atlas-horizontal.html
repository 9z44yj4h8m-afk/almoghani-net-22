<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALMOGHANI LIVE | معاينة</title><style>
*{box-sizing:border-box}body{margin:0;background:#050408;color:#f5f2fa;font-family:Tahoma,Arial,sans-serif}header{height:112px;border-bottom:1px solid #302a3c;display:flex;align-items:center;justify-content:space-between;padding:15px 4%;background:linear-gradient(100deg,#100a1b,#07070c)}.brand{display:flex;align-items:center;gap:23px}.play{width:78px;height:78px;border:2px solid #a52cff;border-radius:19px;display:grid;place-items:center;color:white;font-size:43px;box-shadow:0 0 24px #a326ff}.brand b{font-size:clamp(22px,3vw,44px);letter-spacing:2px;direction:ltr;display:block}.brand small{font-size:21px}.live{background:#7700bd;border-radius:7px;padding:4px 10px;font-size:22px}.topright{font-size:23px;text-align:left}.shell{display:grid;grid-template-columns:minmax(340px,44%) minmax(0,56%);direction:ltr;height:calc(100dvh - 112px)}.browse{direction:rtl;overflow:hidden;display:flex;flex-direction:column;border-right:2px solid #2a2334}.help{height:85px;text-align:center;padding:12px;font-size:18px;line-height:2;border-bottom:1px solid #332b40}.filters{display:flex;gap:12px;padding:14px 20px}.filters button{background:#111018;border:2px solid #37313f;color:white;border-radius:15px;padding:12px 10px;font-size:16px;font-weight:bold;cursor:pointer;white-space:nowrap}.filters button.active{border-color:#ae22ff;background:#29103d;box-shadow:0 0 15px #8922d4}.list{overflow:auto;flex:1}.channel{display:flex;align-items:center;gap:23px;width:calc(100% - 35px);margin:4px 17px;border:2px solid transparent;border-radius:15px;background:#0e0d14;color:#fff;text-align:right;padding:9px 24px;cursor:pointer;min-height:78px}.channel.selected{border-color:#b628ff;background:linear-gradient(90deg,#210d35,#321240);box-shadow:0 0 18px #9c22e0}.logo{height:60px;width:72px;border-radius:15px;background:#fff;display:grid;place-items:center;color:#7924b1;font-size:20px;font-weight:bold;flex-shrink:0;text-align:center}.channel strong{font-size:26px}.channel small{display:block;font-size:17px;color:#d2c7d9;margin-top:6px}.arrow{margin-right:auto;color:#c22aff;font-size:29px}.details{direction:rtl;padding:18px 24px;display:flex;flex-direction:column;justify-content:flex-start;min-width:0;background:radial-gradient(ellipse at 60% 60%,#150a22,#050408 70%)}.screen{width:100%;aspect-ratio:16/9;max-height:min(68vh,650px);flex-shrink:0;background:linear-gradient(130deg,#18101d,#030306);border:2px solid #45324e;border-radius:18px;box-shadow:0 12px 12px -12px #b526ff;overflow:hidden;position:relative}.screen video,.screen iframe{width:100%;height:100%;object-fit:contain;border:0}.badge{position:absolute;top:14px;right:15px;background:red;border-radius:9px;padding:8px 15px;font-weight:bold}.placeholder{height:100%;display:grid;place-items:center;text-align:center;color:#bdb4c4;font-size:24px;padding:30px}.info{display:flex;align-items:center;gap:20px;margin-top:18px}.info .logo{height:105px;width:105px;font-size:25px}.info strong{font-size:clamp(20px,2.4vw,34px)}.info p{font-size:22px;color:#d8cfdd}select{background:#16101d;color:white;border:1px solid #5c356d;padding:12px;border-radius:10px;max-width:100%}@media(max-width:850px){.shell{grid-template-columns:minmax(220px,43%) minmax(0,57%)}.details{padding:9px}.screen{max-height:65vh}header{height:auto;min-height:85px}.brand b{font-size:21px}.brand small,.topright,.help{font-size:12px}.play{width:45px;height:45px;font-size:25px}.shell{height:calc(100dvh - 85px)}.filters{gap:4px;padding:7px}.filters button{padding:8px 5px;font-size:12px}.channel{padding:5px;min-height:60px;gap:8px}.logo{height:45px;width:48px;font-size:12px}.channel strong{font-size:15px}.channel small{font-size:10px}.details{padding:10px}.info{gap:8px}.info .logo{width:60px;height:60px;font-size:13px}.info strong{font-size:18px}.info p{font-size:12px}}@media(orientation:portrait) and (max-width:650px){.shell{grid-template-columns:1fr;grid-template-rows:48% 52%;height:calc(100dvh - 85px)}.browse{grid-row:2;border:0}.details{grid-row:1}.screen{height:calc(100% - 53px);aspect-ratio:16/9;max-height:none;width:100%;object-fit:contain}.info{margin-top:5px}.info .logo{height:42px;width:42px}.help{height:auto;padding:3px}.filters button{font-size:11px}}
</style></head><body><header><div class="brand"><div class="play">▶</div><div><b>ALMOGHANI LIVE <span class="live">LIVE</span></b><small>البث المباشر للقنوات التلفزيونية</small></div></div><div class="topright">📶 &nbsp; ⚙️</div></header><main class="shell"><section class="browse"><div class="help">↕ تنقّل بين القنوات &nbsp; | &nbsp; ▶ للتشغيل &nbsp; | &nbsp; ☆ المفضلة<br>شاشة كاملة &nbsp; | &nbsp; معلومات القناة</div><div class="filters"><button class="active" data-filter="all">🌐 جميع القنوات</button><button data-filter="news">📺 الأخبار</button><button data-filter="sport">🏷️ الرياضة</button><button data-filter="fav">⭐ المفضلة</button></div><div class="list" id="list"></div></section><section class="details"><div class="screen" id="screen"><div class="placeholder">▶<br>اختر قناة لبدء المشاهدة<br><small>يمكن إضافة رابط البث من ملفات قنواتك</small></div></div><div class="info"><div class="logo" id="bigLogo">MBC</div><div><strong id="title">MBC 1</strong><p id="meta">ترفيه • مجموعة MBC • السعودية</p></div></div></section></main><script src="./channels.js"></script><script>
const all=(window.CHANNELS||[]).filter(c=>c.n&&c.u&&!/القنوات الأجنبية/.test(c.g||"")).map((c,i)=>({...c,id:i,name:c.n,logo:c.l||"",meta:c.g||"قنوات عامة",type:/رياض|sport|bein|beIN/i.test(c.g+" "+c.n)?"sport":/إخبار|أخبار|الحدث|العربية|الجزيرة|news/i.test(c.g+" "+c.n)?"news":"all"}));
let current=0,filter="all",query="",player=null;
const list=document.getElementById("list"),screen=document.getElementById("screen");
const logoHTML=c=>c.logo?'<img loading="lazy" src="'+c.logo.replace(/"/g,"&quot;")+'" alt="" style="max-width:90%;max-height:90%;object-fit:contain" onerror="this.style.display=\'none\'">':(c.name||"TV").slice(0,8);
document.querySelector(".help").innerHTML='<input id="search" type="search" placeholder="🔎 ابحث عن قناة..." aria-label="بحث القنوات" style="width:96%;padding:12px;background:#18101f;color:white;border:1px solid #743c92;border-radius:12px;font-size:18px"><div style="font-size:12px">اختر القناة لتشغيل البث • ⭐ للمفضلة</div>';
document.querySelector(".help").style.height="94px";
document.getElementById("search").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();draw()});
function draw(){list.replaceChildren();let filtered=all.filter(c=>(filter==="all"||filter==="fav"&&localStorage.getItem("alm-fav-"+c.id)==="1"||c.type===filter)&&(!query||c.name.toLowerCase().includes(query)));filtered.slice(0,400).forEach(c=>{let b=document.createElement("button");b.className="channel"+(c.id===current?" selected":"");let l=document.createElement("span");l.className="logo";l.innerHTML=logoHTML(c);let t=document.createElement("span");let name=document.createElement("strong");name.textContent=c.name;let meta=document.createElement("small");meta.textContent=c.meta;t.append(name,meta);let star=document.createElement("span");star.textContent=localStorage.getItem("alm-fav-"+c.id)==="1"?"★":"☆";star.style.cssText="margin-right:auto;font-size:25px;color:#c52bff";star.onclick=e=>{e.stopPropagation();let k="alm-fav-"+c.id;localStorage.setItem(k,localStorage.getItem(k)==="1"?"0":"1");draw()};b.append(l,t,star);b.onclick=()=>choose(c.id);list.append(b)});if(!filtered.length)list.textContent="لا توجد قنوات في هذا القسم"}
function stop(){if(player){try{player.pause();player.removeAttribute("src");player.load()}catch(e){}player=null}screen.replaceChildren()}
function choose(i){let c=all.find(x=>x.id===i);if(!c)return;current=i;document.getElementById("title").textContent=c.name;document.getElementById("meta").textContent=c.meta;document.getElementById("bigLogo").innerHTML=logoHTML(c);stop();const u=c.u.trim();let v;if(/youtube\.com|youtu\.be/i.test(u)){let id=(u.match(/[?&]v=([\w-]{11})/)||u.match(/youtu\.be\/([\w-]{11})/)||u.match(/\/live\/([\w-]{11})/)||[])[1];if(id){v=document.createElement("iframe");v.src="https://www.youtube-nocookie.com/embed/"+id+"?autoplay=1";v.allow="autoplay;encrypted-media;picture-in-picture;fullscreen";v.allowFullscreen=true}}else if(/^https:\/\//i.test(u)){v=document.createElement("video");v.controls=true;v.autoplay=true;v.playsInline=true;v.src=u;player=v;v.onerror=()=>{let msg=document.createElement("p");msg.style.cssText="position:absolute;bottom:5px;right:15px;background:#120b1c;color:white;padding:7px;border-radius:6px";msg.textContent="تعذّر تشغيل البث في المتصفح";screen.append(msg)}}if(v)screen.append(v);else{let msg=document.createElement("div");msg.className="placeholder";msg.textContent="هذا الرابط غير مدعوم للتشغيل المباشر";screen.append(msg)}let badge=document.createElement("span");badge.className="badge";badge.textContent="● مباشر";screen.append(badge);draw()}
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));draw()});
if(all.length)choose(0);else draw();
</script></body></html>
