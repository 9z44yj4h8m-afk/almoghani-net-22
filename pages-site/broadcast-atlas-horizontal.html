<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALMOGHANI LIVE — العرض الأفقي</title><style>*{box-sizing:border-box}body{margin:0;background:#080909;color:#eee;font-family:Tahoma,Arial,sans-serif}header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:12px 22px;border-bottom:1px solid #333;background:#111}h1{font-size:20px;margin:0}small{color:#aaa}.layout{display:grid;grid-template-columns:55% 45%;direction:rtl;height:calc(100dvh - 68px)}.player{padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}.screen{width:100%;aspect-ratio:16/9;background:linear-gradient(130deg,#111,#1b2920);border:1px solid #333;display:grid;place-items:center;border-radius:12px;overflow:hidden}.screen video,.screen iframe{width:100%;height:100%;border:0}.info{width:100%;display:flex;align-items:center;gap:15px}.logo{width:64px;height:64px;background:#19351f;border:1px solid #358c49;border-radius:10px;display:grid;place-items:center;font-size:30px}.sidebar{background:#121212;border-right:1px solid #333;display:flex;flex-direction:column;min-width:0}.filters{padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.filters select,.filters input{background:#202020;color:#fff;border:1px solid #444;border-radius:9px;padding:12px;min-width:0}.list{overflow:auto;padding:0 14px 20px}.channel{display:flex;gap:12px;align-items:center;width:100%;padding:12px;border:1px solid transparent;background:#171717;color:#eee;text-align:right;border-radius:10px;margin:6px 0;cursor:pointer}.channel.active{border:2px solid #329b4b;background:#15311d}.channel .icon{font-size:28px;background:#292929;padding:12px;border-radius:8px}.channel b{display:block}.channel small{display:block;margin-top:5px}.hint{font-size:12px;color:#999;padding:0 16px 10px}@media(max-width:750px){.layout{grid-template-columns:1fr;height:auto}.player{padding:12px}.sidebar{height:55dvh;border-right:0;border-top:1px solid #333}.filters{padding:8px}.filters select,.filters input{padding:9px}.screen{aspect-ratio:16/9}}</style></head><body><header><div><h1>🟢 ALMOGHANI LIVE</h1><small>عرض أفقي للقنوات</small></div><span>● LIVE</span></header><main class="layout"><section class="player"><div class="screen" id="screen"><div style="text-align:center"><div style="font-size:52px">📺</div><p>اختر قناة من القائمة لبدء المشاهدة</p></div></div><div class="info"><div class="logo" id="logo">📺</div><div><h2 id="title">اختر قناة</h2><small id="meta">القنوات والتصنيفات</small></div></div></section><aside class="sidebar"><div class="filters"><select id="country"><option value="">🌐 جميع الدول</option></select><select id="category"><option value="">📺 جميع الأقسام</option></select><input id="search" placeholder="🔎 بحث عن قناة"></div><div class="hint">يمكنك إضافة روابط البث المرخصة من ملف M3U الخاص بك.</div><div class="list" id="list"></div><div style="padding:12px"><label style="display:block;border:1px solid #555;padding:10px;border-radius:8px;text-align:center;cursor:pointer">📂 استيراد ملف M3U <input id="file" type="file" accept=".m3u,.m3u8,text/plain" hidden></label></div></aside></main><script>let channels=[{name:"القرآن الكريم",country:"السعودية",group:"إسلامية",icon:"🕋"},{name:"السنة النبوية",country:"السعودية",group:"إسلامية",icon:"🕌"},{name:"السعودية الأولى",country:"السعودية",group:"عامة",icon:"🇸🇦"},{name:"الإخبارية السعودية",country:"السعودية",group:"أخبار",icon:"📰"},{name:"تلفزيون قطر",country:"قطر",group:"عامة",icon:"🇶🇦"},{name:"تلفزيون الكويت",country:"الكويت",group:"عامة",icon:"🇰🇼"},{name:"تلفزيون عمان",country:"عمان",group:"عامة",icon:"🇴🇲"}];const $=id=>document.getElementById(id);function filters(){for(const [id,key] of [["country","country"],["category","group"]]){let v=$(id).value;$(id).innerHTML='<option value="">'+(id==="country"?"🌐 جميع الدول":"📺 جميع الأقسام")+'</option>'+[...new Set(channels.map(x=>x[key]))].filter(Boolean).map(s=>'<option>'+s.replace(/</g,"&lt;")+'</option>').join("");$(id).value=v}render()}function render(){let l=channels.filter(x=>(!$("country").value||x.country===$("country").value)&&(!$("category").value||x.group===$("category").value)&&x.name.includes($("search").value));$("list").replaceChildren(...l.map(c=>{let b=document.createElement("button");b.className="channel";b.innerHTML='<span class="icon">'+(c.icon||"📺")+'</span><span><b></b><small></small></span>';b.querySelector("b").textContent=c.name;b.querySelector("small").textContent=[c.group,c.country].filter(Boolean).join(" • ");b.onclick=()=>{document.querySelectorAll(".channel").forEach(x=>x.classList.remove("active"));b.classList.add("active");$("title").textContent=c.name;$("meta").textContent=[c.group,c.country].filter(Boolean).join(" • ");$("logo").textContent=c.icon||"📺";$("screen").replaceChildren();if(c.url){let v=document.createElement("video");v.controls=true;v.autoplay=true;v.playsInline=true;v.src=c.url;$("screen").append(v)}else{$("screen").textContent="لا يوجد رابط بث مضاف لهذه القناة"}};return b}))}for(let id of ["country","category","search"])$(id).addEventListener("input",render);$("file").onchange=async e=>{let t=await e.target.files[0].text();let items=t.split(/\r?\n/);let out=[];for(let i=0;i<items.length;i++){if(!items[i].startsWith("#EXTINF"))continue;let line=items[i];let name=line.split(",").slice(1).join(",").trim()||"قناة";let group=(line.match(/group-title="([^"]*)"/)||[])[1]||"عام";let country=(line.match(/tvg-country="([^"]*)"/)||[])[1]||"غير محدد";let url=(items[i+1]||"").trim();if(url&&!url.startsWith("#"))out.push({name,group,country,url,icon:"📺"})}if(out.length){channels=out;filters();alert("تم استيراد "+out.length+" قناة")}else alert("لم يُعثر على روابط قنوات صالحة")};filters();</script></body></html>
