<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALMOGHANI LIVE — العرض الأفقي</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#eee;font-family:Arial,Helvetica,sans-serif;height:100%;overflow:hidden}
header{display:none}.layout{height:100dvh;width:100%;display:grid;grid-template-columns:56.5% 43.5%;direction:ltr}
.sidebar{grid-column:1;grid-row:1;direction:ltr;background:#111;display:flex;flex-direction:column;min-height:0;border-left:7px solid #242424;border-right:2px solid #303030;padding:0 7px}
.sidebar:before{content:"🌐  ALMOGHANI LIVE";display:flex;align-items:center;height:76px;flex-shrink:0;padding-left:18px;font-size:25px;font-weight:bold;color:#fff;border-bottom:1px solid #242424}
.hint{order:0;display:flex;align-items:center;min-height:70px;flex-shrink:0;background:#070707;color:#999;padding:8px 15px;font-size:14px;line-height:1.5}
.filters{order:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:6px 0 9px;flex-shrink:0}
.filters select,.filters input{width:100%;min-width:0;background:#181818;border:2px solid #383838;border-radius:11px;color:#f4f4f4;height:53px;padding:7px 10px;font-size:16px;font-weight:600;outline:none}
.filters select:first-child{background:#14291a;border:3px solid #379c4c}
.list{order:2;flex:1;overflow-y:auto;min-height:0;padding:0}
.channel{width:100%;height:77px;display:flex;align-items:center;gap:13px;background:#111;border:2px solid transparent;border-radius:11px;margin:0 0 1px;padding:9px 15px;text-align:left;color:#ddd;cursor:pointer;direction:ltr}
.channel.active{border:3px solid #2f9d49;background:#18331f;box-shadow:inset 0 0 0 1px #173f22}
.channel .icon{height:51px;width:51px;min-width:51px;background:#fff;border-radius:6px;display:grid;place-items:center;font-size:26px;color:#222}
.channel b{display:block;font-size:19px;font-weight:700;line-height:1.2}.channel small{display:block;font-size:14px;color:#999;margin-top:5px}
.channel.active:after{content:"▶";margin-left:auto;color:#329a49;font-size:22px}
.sidebar>div:last-child{order:3;padding:7px 0!important;flex-shrink:0}
.player{grid-column:2;grid-row:1;direction:ltr;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 7%;gap:0}
.screen{width:100%;max-width:460px;aspect-ratio:1.58;background:#000;border:0;border-radius:0;display:flex;justify-content:center;align-items:center;color:#888;overflow:hidden}
.screen video,.screen iframe{height:100%;width:100%;object-fit:contain;border:0}
.info{width:100%;max-width:460px;display:flex;align-items:center;gap:20px;padding-top:4px;direction:ltr;text-align:left}
.logo{width:100px;height:100px;min-width:100px;display:grid;place-items:center;border-radius:8px;background:#fff;color:#222;border:0;font-size:48px}
.info h2{font:normal 39px Georgia,serif;margin:0 0 5px}.info small{font-size:18px;color:#aaa;line-height:1.4}
@media(max-width:700px){.sidebar{padding:0 3px;border-left-width:2px}.sidebar:before{height:48px;font-size:13px;padding-left:4px}.hint{min-height:52px;font-size:9px;padding:4px}.filters{gap:2px;padding:4px 0}.filters select,.filters input{height:34px;font-size:9px;padding:2px;border-width:1px;border-radius:5px}.channel{height:57px;padding:4px;gap:6px}.channel .icon{height:35px;width:35px;min-width:35px;font-size:18px}.channel b{font-size:11px}.channel small{font-size:9px;margin-top:2px}.player{padding:0 3%}.info{gap:6px}.logo{height:43px;width:43px;min-width:43px;font-size:19px}.info h2{font-size:15px}.info small{font-size:10px}}
</style></head><body><header><div><h1>🟢 ALMOGHANI LIVE</h1><small>عرض أفقي للقنوات</small></div><span>● LIVE</span></header><main class="layout"><section class="player"><div class="screen" id="screen"><div style="text-align:center"><div style="font-size:52px">📺</div><p>اختر قناة للمشاهدة</p></div></div><div class="info"><div class="logo" id="logo">📺</div><div><h2 id="title">اختر قناة</h2><small id="meta">القنوات والتصنيفات</small></div></div></section><aside class="sidebar"><div class="filters"><select id="country"><option value="">🌐 جميع الدول</option></select><select id="category"><option value="">📺 جميع الأقسام</option></select><input id="search" placeholder="🔎 بحث عن قناة"></div><div class="hint">يمكنك إضافة روابط البث المرخصة من ملف M3U الخاص بك.</div><div class="list" id="list"></div><div style="padding:12px"><label style="display:block;border:1px solid #555;padding:10px;border-radius:8px;text-align:center;cursor:pointer">📂 استيراد ملف M3U <input id="file" type="file" accept=".m3u,.m3u8,text/plain" hidden></label></div></aside></main><script>let channels=[{name:"القرآن الكريم",country:"السعودية",group:"إسلامية",icon:"🕋"},{name:"السنة النبوية",country:"السعودية",group:"إسلامية",icon:"🕌"},{name:"السعودية الأولى",country:"السعودية",group:"عامة",icon:"🇸🇦"},{name:"الإخبارية السعودية",country:"السعودية",group:"أخبار",icon:"📰"},{name:"تلفزيون قطر",country:"قطر",group:"عامة",icon:"🇶🇦"},{name:"تلفزيون الكويت",country:"الكويت",group:"عامة",icon:"🇰🇼"},{name:"تلفزيون عمان",country:"عمان",group:"عامة",icon:"🇴🇲"}];const $=id=>document.getElementById(id);function filters(){for(const [id,key] of [["country","country"],["category","group"]]){let v=$(id).value;$(id).innerHTML='<option value="">'+(id==="country"?"🌐 جميع الدول":"📺 جميع الأقسام")+'</option>'+[...new Set(channels.map(x=>x[key]))].filter(Boolean).map(s=>'<option>'+s.replace(/</g,"&lt;")+'</option>').join("");$(id).value=v}render()}function render(){let l=channels.filter(x=>(!$("country").value||x.country===$("country").value)&&(!$("category").value||x.group===$("category").value)&&x.name.includes($("search").value));$("list").replaceChildren(...l.map(c=>{let b=document.createElement("button");b.className="channel";b.innerHTML='<span class="icon">'+(c.icon||"📺")+'</span><span><b></b><small></small></span>';b.querySelector("b").textContent=c.name;b.querySelector("small").textContent=[c.group,c.country].filter(Boolean).join(" • ");b.onclick=()=>{document.querySelectorAll(".channel").forEach(x=>x.classList.remove("active"));b.classList.add("active");$("title").textContent=c.name;$("meta").textContent=[c.group,c.country].filter(Boolean).join(" • ");$("logo").textContent=c.icon||"📺";$("screen").replaceChildren();if(c.url){let v=document.createElement("video");v.controls=true;v.autoplay=true;v.playsInline=true;v.src=c.url;$("screen").append(v)}else{$("screen").textContent="لا يوجد رابط بث مضاف لهذه القناة"}};return b}))}for(let id of ["country","category","search"])$(id).addEventListener("input",render);$("file").onchange=async e=>{let t=await e.target.files[0].text();let items=t.split(/\r?\n/);let out=[];for(let i=0;i<items.length;i++){if(!items[i].startsWith("#EXTINF"))continue;let line=items[i];let name=line.split(",").slice(1).join(",").trim()||"قناة";let group=(line.match(/group-title="([^"]*)"/)||[])[1]||"عام";let country=(line.match(/tvg-country="([^"]*)"/)||[])[1]||"غير محدد";let url=(items[i+1]||"").trim();if(url&&!url.startsWith("#"))out.push({name,group,country,url,icon:"📺"})}if(out.length){channels=out;filters();alert("تم استيراد "+out.length+" قناة")}else alert("لم يُعثر على روابط قنوات صالحة")};filters();</script></body></html>
