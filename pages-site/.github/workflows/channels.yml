name: channels

on:
  push:
    branches: [main]
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the channel list from the site
        run: python .github/scripts/channels.py
      - name: Publish it
        run: |
          git config user.name "almoghani-bot"
          git config user.email "bot@almoghani.net"
          git add channels.js
          if git diff --cached --quiet; then
            echo "channels.js is already current"
          else
            git commit -m "chore: refresh channel list [skip ci]"
            git push
          fi
