*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--background);color:var(--foreground);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;min-height:100dvh}

.note{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin:6px 0 18px;padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface-deep);color:var(--muted-foreground);font-size:13px;font-weight:700}

.rows{display:grid;gap:20px}
.row{display:grid;grid-template-columns:minmax(220px,28%) minmax(0,1fr);gap:24px;direction:ltr;align-items:stretch}
.cat{display:flex;align-items:center;justify-content:center;gap:20px;min-height:170px;padding:18px;direction:ltr;border:1px solid var(--border);border-radius:10px;background:linear-gradient(160deg,var(--secondary),var(--surface-deep))}
.cat span{direction:rtl;font-family:"Cairo",sans-serif;font-size:36px;font-weight:900;line-height:1.5}

.shelf{min-width:0;display:grid;gap:12px;align-items:stretch}
.shelf.ch{grid-template-columns:repeat(6,minmax(0,1fr))}
.shelf.po{grid-template-columns:repeat(8,minmax(0,1fr))}
.tile{display:flex;flex-direction:column;gap:8px;min-width:0;padding:12px 6px;border-radius:10px;background:var(--card);text-align:center;transition:transform .15s ease,box-shadow .15s ease}
.tile:hover{transform:translateY(-3px);box-shadow:0 8px 26px oklch(0 0 0/.35)}
.tile img{width:100%;aspect-ratio:1;object-fit:contain;max-height:150px;border-radius:6px;background:var(--surface-deep)}
.tile span{display:block;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:700}
.poster{position:relative;display:block;width:100%;aspect-ratio:2/3;overflow:hidden;border-radius:10px;background:var(--surface)}
.poster img{width:100%;height:100%;object-fit:cover}
.poster em{position:absolute;inset-inline:0;bottom:0;padding:26px 8px 10px;font-style:normal;font-size:13px;font-weight:800;text-align:center;direction:rtl;background:linear-gradient(transparent,var(--surface-deep))}
.search{display:flex;align-items:center;gap:12px;margin:18px 0;padding:5px 16px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.search svg{width:20px;color:var(--primary)}
.search input{flex:1;min-width:0;height:40px;border:0;outline:none;background:transparent;color:var(--foreground)}
.pills{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding-top:14px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--muted-foreground);font-size:14px;font-weight:800;transition:color .15s ease,background .15s ease}

.pill.on{border-color:var(--primary);background:var(--primary);color:var(--primary-foreground)}
.pill svg{width:16px}
.access{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding-top:10px}

.stage{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface-deep)}
.frame{position:relative;aspect-ratio:16/9;background:#000}

.stage-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--border)}
.stage-bar h2{margin:0;font-family:"Cairo",sans-serif;font-size:22px;font-weight:900}
.stage-bar .badge{padding:5px 12px;border-radius:999px;background:var(--primary);color:var(--primary-foreground);font-size:12px;font-weight:900}

.cta b{font-size:20px;font-weight:900;overflow-wrap:anywhere}

.dot{width:44px;height:44px;flex:none;border-radius:50%;background:var(--primary);display:grid;place-items:center;color:var(--primary-foreground)}

@media(max-width:1100px){.work{grid-template-columns:minmax(0,1fr);grid-template-areas:"stage" "list" "rail"}.stage{grid-area:stage}.list{grid-area:list}.rail{grid-area:rail;flex-direction:row;overflow-x:auto}.rail button{min-height:44px;flex:0 0 auto;border-bottom:0;text-align:center}.row{grid-template-columns:200px minmax(0,1fr);gap:16px}.cat span{font-size:26px}.cat svg{width:42px;height:42px}.shelf{display:flex;overflow-x:auto}.tile{flex:0 0 120px}.poster{flex:0 0 110px}.grid.ch{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.po{grid-template-columns:repeat(5,minmax(0,1fr))}}

</style>

        return '<button class="item ' + (i === state.open ? "on" : "") + '" onclick="window.__open(' + i + ')">' +
          (c.l ? '<img src="' + esc(c.l) + '" alt="" loading="lazy">' : "<i>" + esc((c.n || "?").slice(0, 1)) + "</i>") +
          "<span>" + esc(c.n) + "<u>" + esc(c.g) + "</u></span></button>";
      }).join("") : '<div class="empty">لا توجد قناة مطابقة للبحث.</div>') +
      "</div></div>" +
      '<div class="stage">' + stageFrame(current) + "</div>" +
      "</div>" + pills();
  }
  function stageFrame(c) {
    if (!c) return '<div class="frame"></div><div class="stage-bar"><p>اختر قناة للتشغيل.</p></div>';
    var yt = ytId(c.u);
    var body = yt
      ? '<iframe src="https://www.youtube.com/embed/' + yt + '?autoplay=1&rel=0&playsinline=1" title="' + esc(c.n) + '" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>'
      : '<video id="v" controls playsinline></video>';
    return '<div class="frame">' + body + "</div>" +
      '<div class="stage-bar"><span class="badge">مباشر</span><h2>' + esc(c.n) + "</h2><p>" + esc(c.g) + "</p>" +
      (yt ? "" : '<button class="pill" onclick="window.__copy(\'' + esc(c.u) + '\')">نسخ رابط البث</button>') +
      "</div>";
  }
  function attachHls(c) {
    if (!c || ytId(c.u)) return;
    var video = document.getElementById("v");
    if (!video) return;
    if (video.canPlayType("application/vnd.apple.mpegurl")) { video.src = c.u; void video.play().catch(function () {}); return; }
    if (window.Hls) { runHls(video, c.u); return; }
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js";
    s.onload = function () { runHls(video, c.u); };
    s.onerror = function () { showErr(video, "تعذّر تحميل مشغّل البث."); };
    document.head.appendChild(s);
  }
  function runHls(video, src) {
    if (!window.Hls || !window.Hls.isSupported()) { showErr(video, "متصفحك لا يدعم تشغيل البث المباشر."); return; }
    var h = new window.Hls();
    h.on(window.Hls.Events.ERROR, function (_e, data) {
      if (data.fatal) showErr(video, "هذا المصدر لا يرسل بثًا صالحًا الآن — جرّب قناة أخرى أو افتحها في مشغّل خارجي.");
    });
    h.loadSource(src);
    h.attachMedia(video);
    void video.play().catch(function () {});
  }
  function showErr(video, msg) {
    var frame = video && video.parentElement;
    if (!frame) return;
    frame.innerHTML = '<div class="err" style="height:100%;display:grid;place-items:center;text-align:center">' + esc(msg) + "</div>";
  }
  function movies() {
    return "<h1>أفلام كاملة</h1><p class='sub'>مقاطع رسمية كاملة على يوتيوب.</p>" +
      (state.open >= 0 && CH[state.open] ? "" : "") +
      '<div class="grid po">' + MOVIES.map(function (m) {
        return '<a class="poster" href="#/movie/' + m.y + '" aria-label="' + esc(m.t) + '"><img src="https://i.ytimg.com/vi/' + m.y + '/hqdefault.jpg" alt="" loading="lazy"><em>' + esc(m.t) + " · " + esc(m.d) + "</em></a>";
      }).join("") + "</div>" + pills();
  }
  function movie(id) {
    var m = MOVIES.filter(function (x) { return x.y === id; })[0];
    var t = m ? m.t : "فيلم";
    return "<h1>" + esc(t) + "</h1><p class='sub'>تشغيل رسمي من يوتيوب.</p>" +
      '<div class="stage"><div class="frame"><iframe src="https://www.youtube.com/embed/' + esc(id) + '?autoplay=1&rel=0" title="' + esc(t) + '" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>' +
      '<div class="stage-bar"><span class="badge">فيلم</span><h2>' + esc(t) + "</h2></div></div>" +
      '<div class="grid po">' + MOVIES.map(function (x) {
        return '<a class="poster" href="#/movie/' + x.y + '" aria-label="' + esc(x.t) + '"><img src="https://i.ytimg.com/vi/' + x.y + '/hqdefault.jpg" alt="" loading="lazy"><em>' + esc(x.t) + "</em></a>";
      }).join("") + "</div>";
  }
  function series() {
    return "<h1>المسلسلات البدوية</h1><p class='sub'>قوائم تشغيل رسمية بجميع الحلقات.</p>" +
      '<div class="grid po">' + SERIES.map(function (s, i) {
        return '<a class="poster" href="#/series/' + i + '" aria-label="' + esc(s.t) + '"><img src="https://i.ytimg.com/vi/' + playlistThumb(i) + '/hqdefault.jpg" alt="" loading="lazy"><em>' + esc(s.t) + "</em></a>";
      }).join("") + "</div>" + pills();
  }
  function seriesOne(i) {
    var s = SERIES[i];
    if (!s) return '<div class="empty">المسلسل غير موجود.</div>';
    var src = s.p
      ? "https://www.youtube.com/embed/videoseries?list=" + s.p + "&autoplay=1"
      : "https://www.youtube.com/embed/JiFBbINrPVU?autoplay=1";
    return "<h1>" + esc(s.t) + "</h1><p class='sub'>حلقات المسلسل مرتبة داخل قائمة تشغيل.</p>" +
      '<div class="stage"><div class="frame"><iframe src="' + src + '" title="' + esc(s.t) + '" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>' +
      '<div class="stage-bar"><span class="badge">مسلسل</span><h2>' + esc(s.t) + "</h2></div></div>" +
      '<div class="grid po">' + SERIES.map(function (x, j) {
        return '<a class="poster" href="#/series/' + j + '" aria-label="' + esc(x.t) + '"><img src="https://i.ytimg.com/vi/' + playlistThumb(j) + '/hqdefault.jpg" alt="" loading="lazy"><em>' + esc(x.t) + "</em></a>";
      }).join("") + "</div>";
  }
  function contact() {
    return "<h1>التواصل والاشتراك</h1><p class='sub'>لطلب قناة أو اشتراك، تواصل معنا مباشرة.</p>" +
      '<div class="contact">' + CONTACT.map(function (c) {
        return '<a class="cta" href="' + esc(c.u) + '"><span class="dot">' + (CONTACT_ICON[c.k] || ICON.phone) + "</span><span><b>" + esc(c.v) + "</b><em>" + esc(c.k) + "</em></span></a>";
      }).join("") + "</div>" +
      '<div class="note">صفحة الأعضاء الرسمية: <a href="' + HOME + '/auth">almoghani.net/auth</a></div>';
  }
  function render() {
    var path = hash();
    access.innerHTML = [
      { h: HOME + "/auth", t: "دخول الأعضاء", i: ICON.user },
      { h: HOME + "/admin", t: "لوحة التحكم", i: ICON.shield },
      { h: HOME, t: "الموقع", i: ICON.globe },
      { h: "#/contact", t: "التواصل", i: ICON.phone }
    ].map(function (a) { return '<a class="pill" href="' + a.h + '">' + a.i + esc(a.t) + "</a>"; }).join("");
    if (path.indexOf("/watch/") === 0) {
      state.open = Number(path.slice(7));
      var c = CH && CH[state.open];
      view.innerHTML = c ? live() : waiting();
      attachHls(c);
      return;
    }
    if (path.indexOf("/group/") === 0) { state.group = decodeURIComponent(path.slice(7)); state.open = -1; view.innerHTML = live(); attachHls(CH && CH[state.open]); return; }
    if (path === "/live") { state.group = ""; state.open = -1; view.innerHTML = live(); attachHls(CH && CH[state.open]); return; }
    if (path.indexOf("/movie/") === 0) { view.innerHTML = movie(path.slice(7)); return; }
    if (path === "/movies") { view.innerHTML = movies(); return; }
    if (path.indexOf("/series/") === 0) { view.innerHTML = seriesOne(Number(path.slice(8))); return; }
    if (path === "/series") { view.innerHTML = series(); return; }
    if (path === "/contact") { view.innerHTML = contact(); return; }
    state.group = ""; state.open = -1;
    view.innerHTML = home();
  }
  window.__type = function (v) { state.q = v; };
  window.__goSearch = function (e) {
    e.preventDefault();
    state.q = (document.getElementById("q") || {}).value || state.q;
    state.open = -1;
    location.hash = "#/live";
    render();
    return false;
  };
  window.__group = function (g) { state.group = g; state.open = -1; render(); };
  window.__open = function (i) { state.open = i; render(); location.hash = "#/watch/" + i; };
  window.__copy = function (u) {
    if (navigator.clipboard) void navigator.clipboard.writeText(u);
    alert("نُسخ رابط البث: " + u);
  };
  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body>
</html>
