<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="screen-orientation" content="landscape">
<title>ALMOGHANI LIVE</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
:root{--bg:#121417;--panel:#1c1f24;--row:#23272e;--line:#30353d;--red:#e0393e;--green:#5cc66a;--sel:#1d3523}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:#fff;font-family:Rubik,system-ui,sans-serif;overflow:hidden}
.app{display:grid;grid-template-columns:53% 47%;gap:28px;height:100dvh;padding:3.5dvh 1.4vw 3dvh 2vw;direction:ltr}
.left{display:flex;flex-direction:column;min-height:0}
h1{color:var(--red);font-weight:900;font-size:clamp(20px,6.4dvh,40px);line-height:1.05}
.sub{color:var(--green);font-size:clamp(11px,2.8dvh,16px);margin-top:4px}
.keys{color:var(--red);font-size:clamp(9px,2.2dvh,13px);margin:8px 0 12px;white-space:nowrap;overflow:hidden}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:12px}
.tabs button{height:clamp(26px,5.6dvh,34px);border-radius:7px;border:1.5px solid var(--green);background:transparent;color:var(--red);font:700 clamp(10px,2.4dvh,14px) Rubik,sans-serif;cursor:pointer}
.tabs button.on{background:var(--green);color:#111}
.rows{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
.row{display:flex;align-items:center;gap:12px;min-height:clamp(42px,10.2dvh,60px);padding:0 12px;border-radius:9px;background:var(--row);border:1.5px solid transparent;cursor:pointer;flex-shrink:0}
.row.sel{background:var(--sel);border-color:var(--green)}
.row .pl{margin-inline-start:auto;color:var(--green);visibility:hidden}.row.sel .pl{visibility:visible}
.b{width:clamp(28px,6.6dvh,40px);height:clamp(28px,6.6dvh,40px);border-radius:7px;display:grid;place-items:center;font-weight:700;flex-shrink:0;background:center/contain no-repeat}
.big .b{width:clamp(34px,8dvh,44px);height:clamp(34px,8dvh,44px);font-size:20px}
.t{min-width:0}.t strong{display:block;font-weight:700;font-size:clamp(12px,3.1dvh,18px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t small{display:block;color:var(--red);font-size:clamp(9px,2.3dvh,14px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.screen{flex:1;min-height:0;border-radius:8px;overflow:hidden;background:#05071a url(/almoghani-crown.jpg) center/cover;position:relative}
video{position:absolute;inset:0;width:100%;height:100%;background:#000}
.big{display:flex;align-items:center;gap:14px}
.big strong{font-size:clamp(14px,3.8dvh,22px)}
.go{height:clamp(28px,6.4dvh,38px);border:0;border-radius:6px;background:var(--green);color:#111;font:700 clamp(12px,3dvh,17px) Rubik,sans-serif;cursor:pointer}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nav button,.fs{height:clamp(28px,6.4dvh,38px);border-radius:6px;border:1px solid var(--line);background:#181b20;color:#fff;font:700 clamp(11px,2.8dvh,15px) Rubik,sans-serif;cursor:pointer}
.fs{color:#8b9098;font-weight:400}
@media (max-height:500px){.app{gap:12px;padding:8px 10px}.keys{margin:4px 0 6px}.tabs{gap:8px;margin-bottom:6px}.rows{gap:6px}.right{padding:8px;gap:6px}.sub{margin-top:1px}}
@media (orientation:portrait){html,body{overflow:hidden}.left,.right{min-width:0}.app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:10px;padding:10px}.right{order:-1}.screen{flex:none;aspect-ratio:16/9}h1{font-size:26px}.sub{font-size:13px}.keys{font-size:10px}.tabs button{height:32px;font-size:13px}.row{min-height:52px}.b{width:36px;height:36px}.t strong{font-size:15px}.t small{font-size:12px}.big strong{font-size:17px}.go,.nav button,.fs{height:36px;font-size:14px}}
</style>
</head>
<body>
<div class="app">
  <section class="left">
    <h1>ALMOGHANI LIVE</h1>
    <div class="sub">Couch Potato Edition</div>
    <div class="keys">↑↓ Navigate · [Select] Play · [Hold] 🔥 · ← Fullscreen · ↵ Specs · [Sign in]</div>
    <div class="tabs"><button class="on" data-f="live">البث المباشر</button><button data-f="mov">➔ الافلام</button><button data-f="ser">➔ مسلسلات</button></div>
    <div class="rows" id="rows"></div>
  </section>
  <section class="right" id="right">
    <div class="screen" id="screen"><video id="v" playsinline hidden></video></div>
    <div class="big"><div class="b" id="cb">L</div><div class="t"><strong id="cn">—</strong><small id="cm"></small></div></div>
    <button class="go" id="go">▶ تشغيل الآن</button>
    <div class="nav"><button id="nx">▶ التالي</button><button id="pv">◀ السابق</button></div>
    <button class="fs" id="fs">⛶ ملء الشاشة</button>
  </section>
</div>
<script>
const C=['#d63a3a','#2f52d6','#2f6f8a','#7b3fe0','#4a5363','#c9761d','#1f8a5b','#b0368d'];
let all=[],list=[],idx=0,f='live',hls;const $=i=>document.getElementById(i),v=$('v');
function parse(t){const o=[];let c=null;t.split(/\r?\n/).forEach(l=>{l=l.trim();if(l.startsWith('#EXTINF')){c={name:l.split(',').pop().trim(),logo:(l.match(/tvg-logo="([^"]*)"/)||[])[1]||'',group:(l.match(/group-title="([^"]*)"/)||[])[1]||'',country:(l.match(/tvg-country="([^"]*)"/)||[])[1]||''}}else if(c&&l&&!l.startsWith('#')){c.url=l;o.push(c);c=null}});return o}
const meta=c=>[c.group,c.country].filter(Boolean).join(' • ');
function badge(el,c,i){el.textContent=(c.name.match(/[A-Za-z\u0600-\u06FF0-9]/)||['?'])[0].toUpperCase();el.style.backgroundColor=C[i%C.length]}
function apply(){list=all.filter(c=>f==='live'?!/أفلام|افلام|مسلسل|movie|series/i.test(c.group):f==='mov'?/أفلام|افلام|movie|سينما|cinema/i.test(c.group+c.name):/مسلسل|series|دراما|drama/i.test(c.group+c.name));idx=0;draw();info()}
function draw(){const r=$('rows');r.innerHTML='';list.forEach((c,i)=>{const d=document.createElement('div');d.className='row'+(i===idx?' sel':'');d.innerHTML='<div class="b"></div><div class="t"><strong></strong><small></small></div><span class="pl">▶</span>';badge(d.firstChild,c,i);d.querySelector('strong').textContent=c.name;d.querySelector('small').textContent=meta(c);d.onclick=()=>{idx===i?play():(idx=i,draw(),info(),play())};r.appendChild(d)});r.children[idx]?.scrollIntoView({block:'nearest'})}
function info(){const c=list[idx];if(!c){$('cn').textContent='—';$('cm').textContent='';return}badge($('cb'),c,idx);$('cn').textContent=c.name;$('cm').textContent=meta(c)}
function play(){const c=list[idx];if(!c)return;v.hidden=false;if(hls){hls.destroy();hls=null}if(window.Hls&&Hls.isSupported()&&/\.m3u8/.test(c.url)){hls=new Hls();hls.loadSource(c.url);hls.attachMedia(v)}else v.src=c.url;v.play().catch(()=>{})}
function step(n){if(!list.length)return;idx=(idx+n+list.length)%list.length;draw();info();play()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');f=b.dataset.f;apply()});
$('go').onclick=play;$('nx').onclick=()=>step(1);$('pv').onclick=()=>step(-1);
$('fs').onclick=()=>{const e=$('screen');document.fullscreenElement?document.exitFullscreen():(e.requestFullscreen||e.webkitRequestFullscreen).call(e);try{screen.orientation.lock('landscape')}catch(_){}}
addEventListener('keydown',e=>{if(e.key==='ArrowDown')step(1);else if(e.key==='ArrowUp')step(-1);else if(e.key==='Enter')play();else if(e.key==='ArrowLeft')$('fs').click()});
try{screen.orientation.lock('landscape').catch(()=>{})}catch(_){}
fetch('/channels-iptv.m3u').then(r=>r.text()).then(t=>{all=parse(t);apply()});
</script>
</body>
</html>
