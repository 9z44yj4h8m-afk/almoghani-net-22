<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>أطلس البث — نسخة الكنبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
:root{--bg:#090b0c;--panel:#101415;--line:#1d2426;--txt:#e8eeec;--mut:#7d8a86;--acc:#30c66a;--accd:#0f2a1a}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;overflow:hidden}
.app{display:grid;grid-template-columns:56% 44%;height:100dvh;gap:10px;padding:10px}
.list,.view{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.keys{display:flex;gap:14px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mut)}
.keys b{display:inline-block;min-width:22px;padding:1px 6px;margin-inline-end:5px;border:1px solid var(--line);border-radius:5px;background:#161c1e;color:var(--txt);font-family:monospace;text-align:center}
.brand{margin-inline-start:auto;color:var(--acc);font-weight:700}
.filters{display:flex;gap:8px;padding:10px 14px}
.filters button{flex:1;padding:8px;border-radius:9px;border:1px solid var(--line);background:#141a1b;color:var(--txt);font:inherit;font-size:13px;cursor:pointer}
.filters button.on{border-color:var(--acc);color:var(--acc);background:var(--accd)}
.search{margin:0 14px 8px;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:#0c1011;color:var(--txt);font:inherit}
.rows{flex:1;overflow-y:auto;padding:0 10px 10px}
.row{display:flex;align-items:center;gap:12px;padding:8px 10px;margin-bottom:6px;border:1px solid transparent;border-radius:10px;cursor:pointer}
.row:hover{background:#151b1c}
.row.sel{background:var(--accd);border-color:var(--acc);box-shadow:0 0 14px #30c66a55}
.logo{width:44px;height:44px;flex-shrink:0;border-radius:8px;background:#1a2123 center/contain no-repeat;display:grid;place-items:center;font-weight:700;color:var(--acc)}
.nm{flex:1;min-width:0}.nm strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm small{color:var(--mut);font-size:12px}
.q{font-size:11px;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--mut)}
.view{position:relative;background:#000}
video{width:100%;height:100%;object-fit:contain;background:#000}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);text-align:center}
.card{position:absolute;bottom:12px;inset-inline-start:12px;inset-inline-end:12px;display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;background:#090b0ccc;border:1px solid var(--line);backdrop-filter:blur(6px)}
.card .nm small{display:block}
.ctl{display:flex;gap:6px}.ctl button{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:#141a1b;color:var(--txt);font-size:16px;cursor:pointer}
.ctl button:hover{border-color:var(--acc);color:var(--acc)}
@media (orientation:portrait){.app{grid-template-columns:1fr;grid-template-rows:40% 60%}.view{order:-1}}
</style>
</head>
<body>
<div class="app">
  <section class="list">
    <div class="keys"><span><b>↑↓</b>تنقّل</span><span><b>↵</b>تشغيل</span><span><b>I</b>المواصفات</span><span><b>Esc</b>خروج</span><span class="brand">أطلس البث</span></div>
    <div class="filters"><button class="on" data-f="all">الكل</button><button data-f="dev">الأجهزة</button><button data-f="tag">الوسوم</button></div>
    <input class="search" id="q" placeholder="ابحث عن قناة…">
    <div class="rows" id="rows"></div>
  </section>
  <section class="view" id="view">
    <video id="v" playsinline></video>
    <div class="empty" id="empty">شاشتك على موعد<br><small>اختر قناة من القائمة</small></div>
    <div class="card" id="card" hidden>
      <div class="logo" id="cl"></div>
      <div class="nm"><strong id="cn"></strong><small id="cg"></small><small id="cc"></small></div>
      <div class="ctl"><button id="pp" title="تشغيل/إيقاف">⏯</button><button id="fs" title="ملء الشاشة">⛶</button></div>
    </div>
  </section>
</div>
<script>
let all=[],list=[],idx=-1,filter='all',hls;
const $=id=>document.getElementById(id),v=$('v');
function parse(t){const o=[];let c=null;t.split(/\r?\n/).forEach(l=>{l=l.trim();if(l.startsWith('#EXTINF')){c={name:l.split(',').pop().trim(),logo:(l.match(/tvg-logo="([^"]*)"/)||[])[1]||'',group:(l.match(/group-title="([^"]*)"/)||[])[1]||'عام',country:(l.match(/tvg-country="([^"]*)"/)||[])[1]||''}}else if(c&&l&&!l.startsWith('#')){c.url=l;o.push(c);c=null}});return o}
function apply(){const s=$('q').value.trim().toLowerCase();list=all.filter(c=>(!s||c.name.toLowerCase().includes(s)||c.group.includes(s))&&(filter!=='dev'||/\.m3u8/.test(c.url))&&(filter!=='tag'||c.group!=='عام'));draw()}
function logo(el,c){el.style.backgroundImage=c.logo?`url("${c.logo}")`:'';el.textContent=c.logo?'':c.name[0]||'؟'}
function draw(){const r=$('rows');r.innerHTML='';list.forEach((c,i)=>{const d=document.createElement('div');d.className='row'+(i===idx?' sel':'');d.innerHTML='<div class="logo"></div><div class="nm"><strong></strong><small></small></div><span class="q">مباشر</span>';logo(d.firstChild,c);d.querySelector('strong').textContent=c.name;d.querySelector('small').textContent=c.group;d.onclick=()=>play(i);r.appendChild(d)})}
function play(i){if(!list[i])return;idx=i;const c=list[i];draw();document.querySelectorAll('.row')[i]?.scrollIntoView({block:'nearest'});
 $('empty').hidden=true;$('card').hidden=false;logo($('cl'),c);$('cn').textContent=c.name;$('cg').textContent='التصنيف: '+c.group;$('cc').textContent=c.country?'الدولة: '+c.country:'';
 if(hls){hls.destroy();hls=null}
 if(window.Hls&&Hls.isSupported()&&/\.m3u8/.test(c.url)){hls=new Hls();hls.loadSource(c.url);hls.attachMedia(v)}else v.src=c.url;
 v.play().catch(()=>{})}
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;idx=-1;apply()});
$('q').oninput=()=>{idx=-1;apply()};
$('pp').onclick=()=>v.paused?v.play():v.pause();
$('fs').onclick=()=>{const e=$('view');document.fullscreenElement?document.exitFullscreen():(e.requestFullscreen||e.webkitRequestFullscreen).call(e)};
addEventListener('keydown',e=>{if(e.target.id==='q')return;if(e.key==='ArrowDown')play(Math.min(idx+1,list.length-1));else if(e.key==='ArrowUp')play(Math.max(idx-1,0));else if(e.key==='Enter')play(Math.max(idx,0));else if(e.key.toLowerCase()==='i')$('card').hidden=!$('card').hidden;else if(e.key==='Escape'){v.pause();if(document.fullscreenElement)document.exitFullscreen()}});
fetch('/channels-iptv.m3u').then(r=>r.text()).then(t=>{all=parse(t);apply()}).catch(()=>{$('rows').textContent='تعذّر تحميل القنوات'});
</script>
</body>
</html>
